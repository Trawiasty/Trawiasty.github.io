<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kart Pracy i Zestawienie Roczne</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React 18, ReactDOM & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .bg-gray-35 {
            background-color: #a6a6a6 !important;
        }

        .company-letterhead {
            display: block;
            width: 100%;
            max-height: 90px;
            object-fit: contain;
            object-position: center;
        }

        .employee-signature {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            width: auto;
            height: 78px;
            max-width: 300px;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }

        .signature-edit-wrapper {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform-origin: center center;
            z-index: 50;
            touch-action: none;
            user-select: none;
        }

        .signature-edit-wrapper .employee-signature {
            position: static;
            left: auto;
            bottom: auto;
            transform: none;
            display: block;
        }

        .signature-edit-frame {
            position: absolute;
            inset: -7px;
            border: 1.5px dashed #2563eb;
            border-radius: 6px;
            pointer-events: none;
        }

        .signature-edit-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            background: #2563eb;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.35);
            z-index: 60;
            touch-action: none;
            pointer-events: auto;
        }

        .signature-edit-handle.resize {
            right: -15px;
            bottom: -15px;
            cursor: nwse-resize;
        }

        .signature-edit-handle.rotate {
            left: 50%;
            top: -42px;
            transform: translateX(-50%);
            cursor: grab;
        }

        .signature-rotate-line {
            position: absolute;
            left: 50%;
            top: -27px;
            width: 1px;
            height: 20px;
            background: #2563eb;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .signature-drag-surface {
            position: absolute;
            inset: -7px;
            cursor: move;
            z-index: 55;
            touch-action: none;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 11pt;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .page-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            .bg-gray-35 {
                background-color: #a6a6a6 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            table, th, td {
                border-color: #1e293b !important;
            }
            .company-letterhead {
                width: 100% !important;
                max-height: 22mm !important;
                object-fit: contain !important;
            }
            .signature-edit-wrapper {
                bottom: 2.5mm !important;
            }
            .employee-signature {
                height: 22mm !important;
                max-width: 75mm !important;
                bottom: auto !important;
            }
            .signature-edit-frame,
            .signature-edit-handle,
            .signature-rotate-line,
            .signature-drag-surface {
                display: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        // Helper to determine school year (Starts Sept 1st)
        function getCurrentSchoolYear() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1; // 1 - 12
            const startYear = month >= 9 ? year : year - 1;
            return `${startYear}/${startYear + 1}`;
        }

        // Generate +/- 2 years list around current school year
        function generateSchoolYears() {
            const currentSy = getCurrentSchoolYear();
            const startYear = parseInt(currentSy.split('/')[0], 10);
            const years = [];
            for (let i = -2; i <= 2; i++) {
                const y = startYear + i;
                years.push(`${y}/${y + 1}`);
            }
            return years;
        }

        const SCHOOL_YEARS = generateSchoolYears();
        const WORKSHOPS = [
            'Pracownia Edukacji Informatycznej i Kształcenia na Odległość (EIKO)',
            'Pracownia Dydaktyki Cyfrowej (PDC)',
            'Pracownia Przedmiotów Przyrodniczych (PPP)',
            'Samodzielne stanowisko ds. projektów europejskich'
        ];

        const MONTHS = [
            { id: '09', name: 'Wrzesień', order: 0 },
            { id: '10', name: 'Październik', order: 1 },
            { id: '11', name: 'Listopad', order: 2 },
            { id: '12', name: 'Grudzień', order: 3 },
            { id: '01', name: 'Styczeń', order: 4 },
            { id: '02', name: 'Luty', order: 5 },
            { id: '03', name: 'Marzec', order: 6 },
            { id: '04', name: 'Kwiecień', order: 7 },
            { id: '05', name: 'Maj', order: 8 },
            { id: '06', name: 'Czerwiec', order: 9 },
            { id: '07', name: 'Lipiec', order: 10 },
            { id: '08', name: 'Sierpień', order: 11 }
        ];

        function getMonthYear(monthId, schoolYear) {
            const [startYearStr, endYearStr] = schoolYear.split('/');
            const startYear = parseInt(startYearStr, 10);
            const endYear = parseInt(endYearStr, 10);
            const num = parseInt(monthId, 10);
            return num >= 9 ? startYear : endYear;
        }

        function formatPolishVerbalDate(isoDate) {
            if (!isoDate) return '';
            const parts = isoDate.split('-');
            if (parts.length !== 3) return '';
            const year = parts[0];
            const monthNum = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);

            const monthsGenitive = [
                'stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca',
                'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'
            ];

            const monthName = monthsGenitive[monthNum - 1] || '';
            return `Warszawa, dnia ${day} ${monthName} ${year} roku`;
        }

        function formatDateRange(startIso, endIso) {
            if (!startIso && !endIso) return '';
            if (startIso && !endIso) {
                const [y, m, d] = startIso.split('-');
                return `${parseInt(d, 10)}.${m}.${y}`;
            }
            if (!startIso && endIso) {
                const [y, m, d] = endIso.split('-');
                return `${parseInt(d, 10)}.${m}.${y}`;
            }
            if (startIso === endIso) {
                const [y, m, d] = startIso.split('-');
                return `${parseInt(d, 10)}.${m}.${y} (1 dzień)`;
            }
            const d1 = new Date(startIso);
            const d2 = new Date(endIso);
            const [y1, m1, day1] = startIso.split('-');
            const [y2, m2, day2] = endIso.split('-');
            const day1Num = parseInt(day1, 10);
            const day2Num = parseInt(day2, 10);

            const diffTime = Math.abs(d2 - d1);
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;

            if (y1 === y2 && m1 === m2) {
                return `${day1Num}-${day2Num}.${m1}.${y1} (${diffDays} dni)`;
            }
            if (y1 === y2) {
                return `${day1Num}.${m1} - ${day2Num}.${m2}.${y1} (${diffDays} dni)`;
            }
            return `${day1Num}.${m1}.${y1} - ${day2Num}.${m2}.${y2} (${diffDays} dni)`;
        }

        function getTodayIsoDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // Parse CSV text with delimiter detection and quote handling
        function parsePOSCSV(text) {
            const lines = text.split(/\r\n|\n|\r/);
            if (lines.length === 0) return [];

            let delimiter = ';';
            for (const line of lines) {
                if (line.trim()) {
                    const semicoCount = (line.match(/;/g) || []).length;
                    const commaCount = (line.match(/,/g) || []).length;
                    const tabCount = (line.match(/\t/g) || []).length;
                    if (tabCount > semicoCount && tabCount > commaCount) delimiter = '\t';
                    else if (commaCount > semicoCount) delimiter = ',';
                    else delimiter = ';';
                    break;
                }
            }

            const parseLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === delimiter && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            };

            return lines.map(line => parseLine(line)).filter(row => row.some(cell => cell.length > 0));
        }

        // Helper to parse POS date string format
        function parsePOSDate(dateStr) {
            if (!dateStr) return null;
            const cleanStr = dateStr.trim().split(' ')[0];
            if (!cleanStr) return null;

            if (/^\d{4}-\d{2}-\d{2}$/.test(cleanStr)) {
                const [y, m, d] = cleanStr.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            if (/^\d{1,2}[\.-]\d{1,2}[\.-]\d{4}$/.test(cleanStr)) {
                const parts = cleanStr.split(/[\.-]/).map(Number);
                return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            const parsed = new Date(dateStr);
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        // Shared absence date helpers: ISO dates are compared lexicographically.
        const absenceIso = (year, month, day) => {
            const dt = new Date(Number(year), Number(month) - 1, Number(day));
            if (dt.getFullYear() !== Number(year) || dt.getMonth() !== Number(month) - 1 || dt.getDate() !== Number(day)) return null;
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };
        function normalizeAbsenceRanges(items) {
            const cleaned = (Array.isArray(items) ? items : []).filter(r => r && r.start)
                .map(r => ({ start: r.start, end: r.end || r.start }))
                .filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.start) && /^\d{4}-\d{2}-\d{2}$/.test(r.end))
                .map(r => r.end < r.start ? { start: r.end, end: r.start } : r)
                .sort((a, b) => a.start.localeCompare(b.start));
            const result = [];
            cleaned.forEach(r => {
                const last = result[result.length - 1];
                if (last && r.start <= last.end) {
                    if (r.end > last.end) last.end = r.end;
                } else result.push({ ...r });
            });
            return result;
        }
        function parseAbsenceText(text, monthIso) {
            if (!text.trim()) return [];
            const [baseYear, baseMonth] = monthIso.split('-').map(Number);
            const result = [];
            for (const raw of text.split(/[;\n]+/).map(t => t.trim()).filter(Boolean)) {
                const item = raw.replace(/\s*\(\d+\s*(?:dni|dzień)\)\s*$/i, '').trim();
                const full = '(\\d{1,2})\\.(\\d{1,2})\\.(\\d{4})';
                let m, start, end;
                if ((m = item.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) {
                    start = absenceIso(m[4], m[3], m[1]); end = absenceIso(m[4], m[3], m[2]);
                } else if ((m = item.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s*[-–]\s*(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) {
                    start = absenceIso(m[3], m[2], m[1]); end = absenceIso(m[6], m[5], m[4]);
                } else if ((m = item.match(/^(\d{1,2})\.(\d{1,2})\s*[-–]\s*(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) {
                    start = absenceIso(m[5], m[2], m[1]); end = absenceIso(m[5], m[4], m[3]);
                } else if ((m = item.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})\.(\d{1,2})$/))) {
                    start = absenceIso(baseYear, m[3], m[1]); end = absenceIso(baseYear, m[3], m[2]);
                } else if ((m = item.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) {
                    start = end = absenceIso(m[3], m[2], m[1]);
                } else if ((m = item.match(/^(\d{1,2})\.(\d{1,2})$/))) {
                    start = end = absenceIso(baseYear, m[2], m[1]);
                } else if ((m = item.match(/^(\d{1,2})$/))) {
                    start = end = absenceIso(baseYear, baseMonth, m[1]);
                } else throw new Error(`Nie rozpoznano daty: „${raw}”. Użyj np. 1-3.09.2026; 20.09.2026.`);
                if (!start || !end) throw new Error(`Nieprawidłowa data: „${raw}”.`);
                result.push({ start, end });
            }
            return normalizeAbsenceRanges(result);
        }
        function absenceDayCount(ranges) {
            return ranges.reduce((sum, r) => sum + Math.round((Date.parse(r.end + 'T12:00:00Z') - Date.parse(r.start + 'T12:00:00Z')) / 86400000) + 1, 0);
        }

        // Custom Date Range Popover Calendar
        function MultiDateRangePopoverInput({
            label,
            placeholder,
            value,
            onChangeValue,
            ranges = [],
            onRangesChange,
            minDate,
            maxDate,
            monthIso
        }) {
            const [isOpen, setIsOpen] = React.useState(false);
            const today = new Date();
            const [viewYear, setViewYear] = React.useState(today.getFullYear());
            const [viewMonth, setViewMonth] = React.useState(today.getMonth());
            const [pendingStart, setPendingStart] = React.useState(null);
            const [allowOtherMonths, setAllowOtherMonths] = React.useState(false);
            const [inputError, setInputError] = React.useState('');
            const [draftText, setDraftText] = React.useState(value || '');
            React.useEffect(() => { setDraftText(value || ''); setInputError(''); }, [value, monthIso]);
            const monthPrefix = monthIso.slice(0, 7);
            const inBounds = (date) => (!minDate || date >= minDate) && (!maxDate || date <= maxDate);
            const allowed = (date) => inBounds(date) && (allowOtherMonths || date.startsWith(monthPrefix));
            const saveText = () => {
                if (draftText === (value || '')) return;
                try {
                    const parsed = parseAbsenceText(draftText, monthIso);
                    if (parsed.some(r => !inBounds(r.start) || !inBounds(r.end))) throw new Error('Data wykracza poza rok szkolny.');
                    if (parsed.some(r => !r.start.startsWith(monthPrefix) || !r.end.startsWith(monthPrefix)) && !allowOtherMonths)
                        throw new Error('Zakres wykracza poza miesiąc karty. Zaznacz „Pozwól na inne miesiące”.');
                    setInputError('');
                    onRangesChange(parsed);
                } catch (e) { setInputError(e.message); }
            };

            React.useEffect(() => {
                if (isOpen) {
                    const first = ranges[0]?.start || monthIso;
                    if (first) {
                        const d = new Date(first);
                        if (!isNaN(d.getTime())) {
                            setViewYear(d.getFullYear());
                            setViewMonth(d.getMonth());
                        }
                    }
                    setPendingStart(null);
                }
            }, [isOpen]);

            const commitRanges = (items) => {
                const normalized = normalizeAbsenceRanges(items);
                onRangesChange(normalized);
            };

            const addRange = (start, end) => {
                if (!start) return;
                const finish = end || start;
                if (!allowed(start) || !allowed(finish)) return;
                commitRanges([...ranges, { start, end: finish }]);
                setPendingStart(null);
            };

            const handleDayClick = (dateStr) => {
                if (!dateStr || !allowed(dateStr)) return;
                if (!pendingStart) {
                    setPendingStart(dateStr);
                } else {
                    addRange(pendingStart, dateStr);
                }
            };

            const removeRange = (index) => {
                commitRanges(ranges.filter((_, i) => i !== index));
            };

            const clearAll = () => {
                commitRanges([]);
                setPendingStart(null);
            };

            const handlePrevMonth = () => {
                if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); }
                else setViewMonth(viewMonth - 1);
            };
            const handleNextMonth = () => {
                if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); }
                else setViewMonth(viewMonth + 1);
            };

            const renderCalendarDays = () => {
                const firstDay = new Date(viewYear, viewMonth, 1);
                const lastDay = new Date(viewYear, viewMonth + 1, 0);
                let offset = firstDay.getDay() - 1;
                if (offset === -1) offset = 6;
                const days = [];
                const prevLast = new Date(viewYear, viewMonth, 0).getDate();
                for (let i = offset - 1; i >= 0; i--) {
                    days.push({ dayNum: prevLast - i, isCurrentMonth: false, dateStr: null });
                }
                for (let d = 1; d <= lastDay.getDate(); d++) {
                    const mm = String(viewMonth + 1).padStart(2, '0');
                    const dd = String(d).padStart(2, '0');
                    days.push({ dayNum: d, isCurrentMonth: true, dateStr: `${viewYear}-${mm}-${dd}` });
                }
                const remaining = (7 - (days.length % 7)) % 7;
                for (let i = 1; i <= remaining; i++) {
                    days.push({ dayNum: i, isCurrentMonth: false, dateStr: null });
                }
                return days;
            };

            const isDateSelected = (dateStr) =>
                ranges.some(r => dateStr >= r.start && dateStr <= (r.end || r.start));

            const polishMonthNames = [
                'Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'
            ];

            return (
                <div className="relative space-y-1">
                    <label className="block text-[11px] font-bold text-slate-700">{label}</label>
                    <div className="flex items-center gap-1.5">
                        <input
                            type="text"
                            placeholder={placeholder}
                            value={draftText}
                            onChange={(e) => { setDraftText(e.target.value); setInputError(''); }}
                            onBlur={saveText}
                            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); saveText(); e.currentTarget.blur(); } }}
                            className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 bg-white"
                        />
                        <button type="button" onClick={() => setIsOpen(!isOpen)}
                            className={`px-2.5 py-1.5 rounded-lg border text-xs font-semibold transition shrink-0 cursor-pointer ${
                                isOpen ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-300'
                            }`}
                            title="Wybierz jeden lub kilka zakresów dat">
                            <i className="fa-solid fa-calendar-days"></i>
                        </button>
                    </div>

                    {inputError && <p role="alert" className="text-[10px] text-rose-700">{inputError}</p>}
                    <div className="text-[10px] text-slate-500">Łącznie zaznaczono: <strong>{absenceDayCount(ranges)} dni kalendarzowych</strong>.</div>
                    <label className="flex items-center gap-1.5 text-[10px] text-slate-600 cursor-pointer">
                        <input type="checkbox" checked={allowOtherMonths} onChange={e => setAllowOtherMonths(e.target.checked)} />
                        Pozwól na inne miesiące (w granicach roku szkolnego)
                    </label>
                    {ranges.length > 0 && (
                        <div className="flex flex-wrap gap-1 pt-1">
                            {ranges.map((r, i) => (
                                <span key={`${r.start}-${r.end}-${i}`} className="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-blue-50 border border-blue-200 text-[10px] text-blue-800">
                                    {formatDateRange(r.start, r.end || r.start)}
                                    <button type="button" onClick={() => removeRange(i)} className="text-blue-500 hover:text-rose-600 cursor-pointer" title="Usuń ten zakres">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </span>
                            ))}
                        </div>
                    )}

                    {isOpen && (
                        <div className="absolute left-0 top-full mt-1.5 p-3 bg-white border border-slate-300 rounded-2xl shadow-xl z-30 w-80 select-none">
                            <div className="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
                                <button type="button" onClick={handlePrevMonth} className="p-1 text-slate-500 hover:bg-slate-100 rounded cursor-pointer">
                                    <i className="fa-solid fa-chevron-left text-xs"></i>
                                </button>
                                <span className="text-xs font-bold text-slate-800">{polishMonthNames[viewMonth]} {viewYear}</span>
                                <button type="button" onClick={handleNextMonth} className="p-1 text-slate-500 hover:bg-slate-100 rounded cursor-pointer">
                                    <i className="fa-solid fa-chevron-right text-xs"></i>
                                </button>
                            </div>

                            <div className="text-[10px] text-slate-500 bg-slate-50 rounded-lg p-2 mb-2">
                                Kliknij pierwszy i ostatni dzień zakresu. Dla pojedynczej daty kliknij dzień, a następnie „Dodaj pojedynczy dzień”. Możesz dodać dowolną liczbę rozdzielnych zakresów.
                            </div>

                            <div className="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 mb-1">
                                <span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>So</span><span>Nd</span>
                            </div>
                            <div className="grid grid-cols-7 gap-0.5 text-center text-xs">
                                {renderCalendarDays().map((dObj, idx) => {
                                    if (!dObj.isCurrentMonth) {
                                        return <div key={idx} className="py-1.5 text-slate-300 text-[11px]">{dObj.dayNum}</div>;
                                    }
                                    const dStr = dObj.dateStr;
                                    const selected = isDateSelected(dStr);
                                    const pending = pendingStart === dStr;
                                    const disabled = !allowed(dStr);
                                    return (
                                        <button key={idx} type="button" disabled={disabled} onClick={() => handleDayClick(dStr)}
                                            className={`py-1.5 text-[11px] rounded-lg transition ${disabled ? 'bg-slate-50 text-slate-300 cursor-not-allowed' : 'cursor-pointer'} ${
                                                pending ? 'bg-amber-500 text-white font-bold ring-2 ring-amber-200' :
                                                selected ? 'bg-blue-600 text-white font-bold' :
                                                'hover:bg-blue-50 text-slate-700'
                                            }`}>
                                            {dObj.dayNum}
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="mt-2.5 pt-2 border-t border-slate-100 space-y-2">
                                <div className="text-[10px] text-slate-500">
                                    {pendingStart ? `Początek: ${formatDateRange(pendingStart, pendingStart)} — wybierz koniec lub dodaj pojedynczy dzień.` : 'Wybierz początek kolejnego zakresu.'}
                                </div>
                                <div className="flex flex-wrap items-center justify-between gap-1">
                                    <div className="flex gap-1">
                                        <button type="button" disabled={!pendingStart} onClick={() => addRange(pendingStart, pendingStart)}
                                            className={`px-2 py-1 text-[10px] font-bold rounded-lg ${
                                                pendingStart ? 'bg-amber-100 text-amber-800 hover:bg-amber-200 cursor-pointer' : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                            }`}>
                                            Dodaj pojedynczy dzień
                                        </button>
                                        {pendingStart && <button type="button" onClick={() => setPendingStart(null)} className="px-2 py-1 text-[10px] font-bold bg-slate-100 rounded-lg">Anuluj wybór</button>}
                                        {ranges.length > 0 && (
                                            <button type="button" onClick={clearAll} className="px-2 py-1 text-[10px] font-bold bg-rose-50 text-rose-700 rounded-lg hover:bg-rose-100 cursor-pointer">
                                                Wyczyść
                                            </button>
                                        )}
                                    </div>
                                    <button type="button" onClick={() => setIsOpen(false)}
                                        className="px-2.5 py-1 text-[11px] font-bold bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer">
                                        Gotowe
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Main App Component
        function App() {
            // Pamięć danych jest domyślnie wyłączona. Zapamiętywana jest tylko decyzja użytkownika.
            const [persistenceEnabled, setPersistenceEnabled] = React.useState(

            const readPersistent = (key, fallback = '') =>
                localStorage.getItem('app_persistence_enabled') === 'true'

            const [teacherName, setTeacherName] = React.useState(() => readPersistent('app_teacher_name', ''));
            const [workshop, setWorkshop] = React.useState(() => readPersistent('app_workshop', WORKSHOPS[0]));
            const [schoolYear, setSchoolYear] = React.useState(() => getCurrentSchoolYear());
            const [activeMonthId, setActiveMonthId] = React.useState('09');
            const [activeView, setActiveView] = React.useState('form');
            const [employeeSignature, setEmployeeSignature] = React.useState(() => readPersistent('app_employee_signature', ''));
            const [showEmployeeSignature, setShowEmployeeSignature] = React.useState(() => readPersistent('app_show_employee_signature', 'true') !== 'false');
            const [companyLetterhead, setCompanyLetterhead] = React.useState(() => readPersistent('app_company_letterhead', ''));
            const [showCompanyLetterhead, setShowCompanyLetterhead] = React.useState(() => readPersistent('app_show_company_letterhead', 'true') !== 'false');

            const [monthlyData, setMonthlyData] = React.useState(() => {
                if (localStorage.getItem('app_persistence_enabled') !== 'true') return {};
                try {
                    const saved = localStorage.getItem('app_monthly_data');
                    return saved ? JSON.parse(saved) : {};

            const persistentKeys = [
                'app_teacher_name', 'app_workshop', 'app_monthly_data',

            const clearPersistentAppData = () => {
                persistentKeys.forEach(key => localStorage.removeItem(key));

            const saveCurrentSessionToLocalStorage = () => {

                    localStorage.setItem('app_workshop', workshop);
                    localStorage.setItem('app_monthly_data', JSON.stringify(monthlyData));
                    if (employeeSignature) localStorage.setItem('app_employee_signature', employeeSignature);
                    else localStorage.removeItem('app_employee_signature');
                    localStorage.setItem('app_show_employee_signature', String(showEmployeeSignature));
                    if (companyLetterhead) localStorage.setItem('app_company_letterhead', companyLetterhead);
                    else localStorage.removeItem('app_company_letterhead');

            const handlePersistenceChange = (enabled) => {
                setPersistenceEnabled(enabled);
                localStorage.setItem('app_persistence_enabled', String(enabled));
                if (enabled) {
                    // Włączenie zapisuje także dane już wpisane w bieżącej sesji.
                    try {

                        localStorage.setItem('app_show_employee_signature', String(showEmployeeSignature));
                        if (companyLetterhead) localStorage.setItem('app_company_letterhead', companyLetterhead);
                        localStorage.setItem('app_show_company_letterhead', String(showCompanyLetterhead));
                    } catch (err) {
                        console.warn('Nie udało się włączyć zapisu danych.', err);

                } else {
                    // Dane pozostają na ekranie do końca sesji, ale kopia trwała jest usuwana.
                    clearPersistentAppData();

            React.useEffect(() => {

                    {/* Active View Router */}
                    <main>

        // Form Editor Component
        function FormEditor({
            teacherName,
            setTeacherName,
            workshop,
            setWorkshop,
            schoolYear,
            activeMonthId,
            currentMonthData,
            updateCurrentMonth,
            monthlyData,
            setMonthlyData,
            employeeSignature,
            setEmployeeSignature,
            showEmployeeSignature,
            setShowEmployeeSignature,
            companyLetterhead,
            setCompanyLetterhead,
            showCompanyLetterhead,
            setShowCompanyLetterhead
        }) {
            const currentMonthObj = MONTHS.find(m => m.id === activeMonthId);

            const handlePOSCSVImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const rows = parsePOSCSV(text);
                        if (rows.length < 2) {
                            alert('Plik CSV jest pusty lub nieprawidłowy.');
                            return;
                        }

                        // Header detection
                        const headerRow = rows[0].map(h => h.toLowerCase().trim().replace(/^"/, '').replace(/"$/, ''));
                        
                        let idxKod = headerRow.findIndex(h => h.includes('kod'));
                        let idxNazwa = headerRow.findIndex(h => h.includes('nazwa'));
                        let idxPodtytul = headerRow.findIndex(h => h.includes('podtytuł') || h.includes('podtytul'));
                        let idxDataOd = headerRow.findIndex(h => h.includes('data od') || h.includes('rozpoczęcia') || h === 'od');
                        let idxDataDo = headerRow.findIndex(h => h.includes('data do') || h.includes('zakończenia') || h === 'do');
                        let idxGodzStac = headerRow.findIndex(h => h.includes('stacjonarnych'));
                        let idxGodzOnl = headerRow.findIndex(h => h.includes('online'));
                        let idxUczestnicy = headerRow.findIndex(h => h.includes('uczestników') || h.includes('uczestnikow'));

                        // Fallback indices matching POS default structure
                        if (idxKod === -1) idxKod = 5;
                        if (idxNazwa === -1) idxNazwa = 2;
                        if (idxPodtytul === -1) idxPodtytul = 3;
                        if (idxDataOd === -1) idxDataOd = 6;
                        if (idxDataDo === -1) idxDataDo = 7;
                        if (idxGodzStac === -1) idxGodzStac = 11;
                        if (idxGodzOnl === -1) idxGodzOnl = 12;
                        if (idxUczestnicy === -1) idxUczestnicy = 13;

                        const [startYearStr, endYearStr] = schoolYear.split('/');
                        const startYear = parseInt(startYearStr, 10);
                        const endYear = parseInt(endYearStr, 10);

                        let totalImportedCount = 0;
                        const updatedMonthlyData = { ...monthlyData };

                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length === 0) continue;

                            const code = row[idxKod] ? row[idxKod].trim() : '';
                            const mainName = row[idxNazwa] ? row[idxNazwa].trim() : '';
                            const subTitle = row[idxPodtytul] ? row[idxPodtytul].trim() : '';
                            
                            let name = mainName;
                            if (subTitle) {
                                name = name ? `${name} - ${subTitle}` : subTitle;
                            }

                            if (!code && !name) continue;

                            const dateOdStr = row[idxDataOd] ? row[idxDataOd].trim() : '';
                            const dateDoStr = row[idxDataDo] ? row[idxDataDo].trim() : '';

                            const startDate = parsePOSDate(dateOdStr);
                            const endDate = parsePOSDate(dateDoStr) || startDate;

                            if (!startDate) continue;

                            const godzStac = parseFloat((row[idxGodzStac] || '0').replace(',', '.')) || 0;
                            const godzOnl = parseFloat((row[idxGodzOnl] || '0').replace(',', '.')) || 0;
                            const totalHours = godzStac + godzOnl;

                            const participants = row[idxUczestnicy] ? row[idxUczestnicy].trim() : '';

                            // Find all school-year months overlapped by the course.
                            // If a course spans more than one month, divide its total hours equally
                            // between all months and save the divided value in every occurrence.
                            const matchingMonths = MONTHS.filter(m => {
                                const monthNum = parseInt(m.id, 10);
                                const year = monthNum >= 9 ? startYear : endYear;
                                const monthStart = new Date(year, monthNum - 1, 1, 0, 0, 0);
                                const monthEnd = new Date(year, monthNum, 0, 23, 59, 59);
                                return startDate <= monthEnd && endDate >= monthStart;
                            });

                            const monthsCount = matchingMonths.length;
                            const hoursPerMonth = monthsCount > 0
                                ? Math.round((totalHours / monthsCount) * 100) / 100
                                : totalHours;

                            matchingMonths.forEach(m => {
                                const monthKey = `${schoolYear}_${m.id}`;
                                const existingMonth = updatedMonthlyData[monthKey] || {};
                                const currentCourses = existingMonth.courses || [];

                                // Check duplicate entry in that month
                                const isDuplicate = currentCourses.some(c => 
                                    (c.code && code && c.code === code) && (c.name && name && c.name === name)
                                );

                                if (!isDuplicate) {
                                    const newCourse = {
                                        id: Date.now() + Math.random(),
                                        code: code,
                                        name: name,
                                        hours: hoursPerMonth ? String(hoursPerMonth) : '',
                                        participants: participants,
                                        statePriorities: '',
                                        oeizkPriorities: '',
                                        cancelled: false
                                    };
                                    updatedMonthlyData[monthKey] = {
                                        ...existingMonth,
                                        courses: [...currentCourses, newCourse]
                                    };
                                    totalImportedCount++;
                                }
                            });
                        }

                        setMonthlyData(updatedMonthlyData);

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;

                    // Estimate the background from the four image corners.
                    const cornerSize = Math.max(1, Math.min(12, Math.floor(Math.min(canvas.width, canvas.height) * 0.03)));
                    let rSum = 0, gSum = 0, bSum = 0, samples = 0;

                    const sampleCorner = (startX, startY) => {
                        for (let y = startY; y < startY + cornerSize; y++) {
                            for (let x = startX; x < startX + cornerSize; x++) {
                                const i = (y * canvas.width + x) * 4;
                                rSum += data[i];
                                gSum += data[i + 1];
                                bSum += data[i + 2];
                                samples++;
                            }
                        }
                    };

                    sampleCorner(0, 0);
                    sampleCorner(canvas.width - cornerSize, 0);
                    sampleCorner(0, canvas.height - cornerSize);
                    sampleCorner(canvas.width - cornerSize, canvas.height - cornerSize);

                    const bgR = rSum / samples;
                    const bgG = gSum / samples;
                    const bgB = bSum / samples;

                    // Soft threshold preserves anti-aliased signature edges.
                    const transparentAt = 28;
                    const opaqueAt = 95;

                    for (let i = 0; i < data.length; i += 4) {
                        const dr = data[i] - bgR;
                        const dg = data[i + 1] - bgG;
                        const db = data[i + 2] - bgB;
                        const distance = Math.sqrt(dr * dr + dg * dg + db * db);

                        if (distance <= transparentAt) {
                            data[i + 3] = 0;
                        } else if (distance < opaqueAt) {
                            const factor = (distance - transparentAt) / (opaqueAt - transparentAt);
                            data[i + 3] = Math.round(data[i + 3] * factor);
                        }
                    }

                    ctx.putImageData(imageData, 0, 0);
                    setEmployeeSignature(canvas.toDataURL('image/png'));
                    setShowEmployeeSignature(true);

        // Print Document Preview Component

                offsetY: 0,

            };

            const [showSignatureHint, setShowSignatureHint] = React.useState(true);

            React.useEffect(() => {
                setShowSignatureHint(true);
            }, [activeMonthId]);

            const updateSignatureStyle = (patch) => {
                updateCurrentMonth({
                    signatureStyle: {
                        ...signatureStyle,
                        ...patch
                    }
                });
            };

            const resetSignatureStyle = () => {
                updateCurrentMonth({
                    signatureStyle: {
                        scale: 1,
                        rotation: 0,
                        offsetX: 0,
                        offsetY: 0
                    }
                });
            };

            const startSignatureInteraction = (mode, event) => {
                if (!employeeSignature || !showEmployeeSignature) return;

                event.preventDefault();
                event.stopPropagation();

                const editor = event.currentTarget.closest('[data-signature-editor]');
                if (!editor) return;

                const rect = editor.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const startX = event.clientX;
                const startY = event.clientY;
                const startStyle = { ...signatureStyle };

                const startDistance = Math.max(
                    1,
                    Math.hypot(startX - centerX, startY - centerY)
                );
                const startAngle = Math.atan2(startY - centerY, startX - centerX) * 180 / Math.PI;

                const handleMove = (moveEvent) => {
                    moveEvent.preventDefault();

                    if (mode === 'move') {
                        updateSignatureStyle({
                            offsetX: Math.round(startStyle.offsetX + (moveEvent.clientX - startX)),
                            offsetY: Math.round(startStyle.offsetY + (moveEvent.clientY - startY))
                        });
                        return;
                    }

                    if (mode === 'resize') {
                        const distance = Math.max(
                            1,
                            Math.hypot(moveEvent.clientX - centerX, moveEvent.clientY - centerY)
                        );
                        const nextScale = Math.min(2.5, Math.max(0.4, startStyle.scale * (distance / startDistance)));
                        updateSignatureStyle({
                            scale: Math.round(nextScale * 100) / 100
                        });
                        return;
                    }

                    if (mode === 'rotate') {
                        const angle = Math.atan2(moveEvent.clientY - centerY, moveEvent.clientX - centerX) * 180 / Math.PI;
                        let nextRotation = startStyle.rotation + (angle - startAngle);

                        while (nextRotation > 180) nextRotation -= 360;
                        while (nextRotation < -180) nextRotation += 360;

                        updateSignatureStyle({
                            rotation: Math.round(nextRotation)
                        });
                    }
                };

                const handleUp = () => {
                    window.removeEventListener('pointermove', handleMove);
                    window.removeEventListener('pointerup', handleUp);
                    window.removeEventListener('pointercancel', handleUp);
                };

                window.addEventListener('pointermove', handleMove, { passive: false });
                window.addEventListener('pointerup', handleUp, { once: true });
                window.addEventListener('pointercancel', handleUp, { once: true });
            };

        // Annual Summary Dashboard Component
        function AnnualSummary({
