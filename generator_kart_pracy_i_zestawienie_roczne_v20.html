        }) {
            let totalOrdConsultations = 0;
            let totalOrdPeople = 0;
            let totalOrdHours = 0;

            let totalKkConsultations = 0;
            let totalKkPeople = 0;
            let totalKkHours = 0;

            let totalOrgHours = 0;
            let totalSeminarsHours = 0;
            let totalCourseHours = 0;
            let totalParticipants = 0;
            let totalCoursesCount = 0;
            let totalCancelledCoursesCount = 0;
            let totalCancelledCourseHours = 0;
            let totalCancelledParticipants = 0;
            let totalTasksCount = 0;

            MONTHS.forEach(m => {
                const key = `${schoolYear}_${m.id}`;
                const data = monthlyData[key];
                if (data) {
                    const ordC = parseInt(data.ordinaryConsultations || 0, 10);
                    const ordP = parseInt(data.ordinaryPeople || data.ordinaryConsultations || 0, 10);
                    const ordH = parseInt(data.ordinaryHours || 0, 10);

                    const kkC = parseInt(data.kkConsultations || 0, 10);
                    const kkP = parseInt(data.kkPeople || data.kkConsultations || 0, 10);
                    const kkH = parseInt(data.kkHours || 0, 10);

                    totalOrdConsultations += ordC;
                    totalOrdPeople += ordP;
                    totalOrdHours += ordH;

                    totalKkConsultations += kkC;
                    totalKkPeople += kkP;
                    totalKkHours += kkH;

                    totalOrgHours += parseInt(data.orgMeetingsHours || 0, 10);
                    totalSeminarsHours += parseInt(data.internalSeminarsHours || 0, 10);

                    if (data.courses && Array.isArray(data.courses)) {
                        const realizedCourses = data.courses.filter(c => !c.cancelled);
                        const cancelledCourses = data.courses.filter(c => c.cancelled);

                        totalCoursesCount += realizedCourses.length;
                        realizedCourses.forEach(c => {
                            totalCourseHours += parseInt(c.hours || 0, 10);
                            totalParticipants += parseInt(c.participants || 0, 10);
                        });

                        totalCancelledCoursesCount += cancelledCourses.length;
                        cancelledCourses.forEach(c => {
                            totalCancelledCourseHours += parseInt(c.hours || 0, 10);
                            totalCancelledParticipants += parseInt(c.participants || 0, 10);
                        });
                    }

                    if (data.tasks && Array.isArray(data.tasks)) {
                        totalTasksCount += data.tasks.length;
                    }
                }
            });

            const totalConsultations = totalOrdConsultations + totalKkConsultations;
            const totalPeopleConsulted = totalOrdPeople + totalKkPeople;
            const totalConsultationHours = totalOrdHours + totalKkHours;

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-3 gap-2">
                            <div>
                                <h2 className="text-base font-bold text-slate-900">
                                    Podsumowanie Roczne – Rok szkolny {schoolYear}
                                </h2>
                                <p className="text-xs text-slate-500">
                                    {teacherName || 'Brak nazwiska'} ({workshop})
                                </p>
                            </div>
                        </div>

                        {/* Key Metrics Cards */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 flex flex-col justify-between">
                                <div>
                                    <span className="text-xs font-semibold text-blue-600 uppercase tracking-wider block">Konsultacje Łącznie</span>
                                    <span className="text-2xl font-black text-blue-900 mt-1 block">
                                        {totalConsultations} <span className="text-xs font-normal text-blue-700">({totalConsultationHours}h)</span>
                                    </span>
                                </div>
                                <div className="text-[11px] text-blue-800 mt-2 space-y-0.5 border-t border-blue-200/60 pt-2">
                                    <div className="flex justify-between">
                                        <span className="font-semibold">Zwykłe:</span>
                                        <span>{totalOrdConsultations} ({totalOrdPeople} os. / {totalOrdHours}h)</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="font-semibold">Kierownicze:</span>
                                        <span>{totalKkConsultations} ({totalKkPeople} os. / {totalKkHours}h)</span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 flex flex-col justify-between">
                                <div>
                                    <span className="text-xs font-semibold text-indigo-600 uppercase tracking-wider block">Dydaktyka</span>
                                    <span className="text-2xl font-black text-indigo-900 mt-1 block">{totalCoursesCount} form</span>
                                </div>
                                <div className="text-[11px] text-indigo-700 mt-2 space-y-1 border-t border-indigo-200/60 pt-2">
                                    <div>
                                        Uczestnicy: <strong className="font-semibold">{totalParticipants}</strong> | Godziny: <strong className="font-semibold">{totalCourseHours}h</strong>
                                    </div>
                                    <div className="text-rose-700">
                                        Odwołane: <strong className="font-semibold">{totalCancelledCoursesCount}</strong>
                                        {totalCancelledCoursesCount > 0 && (
                                            <span> ({totalCancelledParticipants} os. / {totalCancelledCourseHours}h)</span>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 flex flex-col justify-between">
                                <div>
                                    <span className="text-xs font-semibold text-emerald-600 uppercase tracking-wider block">Zrealizowane Zadania</span>
                                    <span className="text-2xl font-black text-emerald-900 mt-1 block">{totalTasksCount}</span>
                                </div>
                                <span className="text-[11px] text-emerald-700 mt-2 block border-t border-emerald-200/60 pt-2">
                                    Wszystkie zadania ze sprawozdań
                                </span>
                            </div>

                            <div className="bg-amber-50 p-4 rounded-xl border border-amber-100 flex flex-col justify-between">
                                <div>
                                    <span className="text-xs font-semibold text-amber-600 uppercase tracking-wider block">Zebrania & Seminaria</span>
                                    <span className="text-2xl font-black text-amber-900 mt-1 block">{totalOrgHours + totalSeminarsHours}h</span>
                                </div>
                                <span className="text-[11px] text-amber-700 mt-2 block border-t border-amber-200/60 pt-2">
                                    Zebrania: <strong className="font-semibold">{totalOrgHours}h</strong> | Seminaria: <strong className="font-semibold">{totalSeminarsHours}h</strong>
                                </span>
                            </div>
                        </div>

                        {/* Breakdown Table */}
                        <div className="pt-4">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3">
                                Szczegółowe zestawienie miesięczne
                            </h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs border-collapse border border-slate-200">
                                    <thead>
                                        <tr className="bg-slate-100 text-slate-700 font-bold text-center">
                                            <th rowSpan="2" className="border border-slate-200 p-2 text-left align-middle">Miesiąc</th>
                                            <th colSpan="2" className="border border-slate-200 p-1.5 border-b-slate-300">Konsultacje (il. / os. / h)</th>
                                            <th rowSpan="2" className="border border-slate-200 p-2 align-middle">Zebrania / Seminaria (h)</th>
                                            <th rowSpan="2" className="border border-slate-200 p-2 align-middle">Formy dydaktyczne (il. / os. / h)</th>
                                            <th rowSpan="2" className="border border-slate-200 p-2 align-middle">Zadania (ilość)</th>
                                        </tr>
                                        <tr className="bg-slate-100 text-slate-700 font-bold text-center text-[11px]">
                                            <th className="border border-slate-200 p-1.5 bg-slate-50">Zwykłe</th>
                                            <th className="border border-slate-200 p-1.5 bg-slate-50">Dla kadry kierowniczej</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {MONTHS.map(m => {
                                            const key = `${schoolYear}_${m.id}`;
                                            const d = monthlyData[key] || {};
                                            const ordC = parseInt(d.ordinaryConsultations || 0, 10);
                                            const ordP = parseInt(d.ordinaryPeople || d.ordinaryConsultations || 0, 10);
                                            const ordH = parseInt(d.ordinaryHours || 0, 10);

                                            const kkC = parseInt(d.kkConsultations || 0, 10);
                                            const kkP = parseInt(d.kkPeople || d.kkConsultations || 0, 10);
                                            const kkH = parseInt(d.kkHours || 0, 10);

                                            const realizedCourses = d.courses ? d.courses.filter(c => !c.cancelled) : [];
                                            const cancelledCourses = d.courses ? d.courses.filter(c => c.cancelled) : [];
                                            const cCount = realizedCourses.length;
                                            const cCancelledCount = cancelledCourses.length;
                                            let cPart = 0;
                                            let cHours = 0;
                                            realizedCourses.forEach(c => {
                                                cPart += parseInt(c.participants || 0, 10);
                                                cHours += parseInt(c.hours || 0, 10);
                                            });

                                            const tCount = d.tasks ? d.tasks.length : 0;

                                            return (
                                                <tr key={m.id} className="hover:bg-slate-50 text-center">
                                                    <td className="border border-slate-200 p-2 text-left font-bold text-slate-800">
                                                        {m.name} {getMonthYear(m.id, schoolYear)}
                                                    </td>
                                                    <td className="border border-slate-200 p-2">
                                                        {ordC > 0 ? `${ordC} / ${ordP} / ${ordH}h` : '-'}
                                                    </td>
                                                    <td className="border border-slate-200 p-2">
                                                        {kkC > 0 ? `${kkC} / ${kkP} / ${kkH}h` : '-'}
                                                    </td>
                                                    <td className="border border-slate-200 p-2">
                                                        {(parseInt(d.orgMeetingsHours || 0, 10) || parseInt(d.internalSeminarsHours || 0, 10))
                                                            ? `${d.orgMeetingsHours || 0}h / ${d.internalSeminarsHours || 0}h`
                                                            : '-'}
                                                    </td>
                                                    <td className="border border-slate-200 p-2">
                                                        <div>{cCount > 0 ? `${cCount} form / ${cPart} os. / ${cHours}h` : '-'}</div>
                                                        {cCancelledCount > 0 && (
                                                            <div className="text-[10px] text-rose-600 mt-0.5">
                                                                odwołane: {cCancelledCount}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="border border-slate-200 p-2 font-semibold">
                                                        {tCount > 0 ? `${tCount}` : '-'}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        
                                        {/* Summary Row */}
                                        <tr className="bg-slate-100 font-bold text-slate-900 text-center border-t-2 border-slate-300">
                                            <td className="border border-slate-200 p-2 text-left">SUMA ROCZNA</td>
                                            <td className="border border-slate-200 p-2">
                                                {totalOrdConsultations > 0 ? `${totalOrdConsultations} / ${totalOrdPeople} / ${totalOrdHours}h` : '-'}
                                            </td>
                                            <td className="border border-slate-200 p-2">
                                                {totalKkConsultations > 0 ? `${totalKkConsultations} / ${totalKkPeople} / ${totalKkHours}h` : '-'}
                                            </td>
                                            <td className="border border-slate-200 p-2">
                                                {(totalOrgHours || totalSeminarsHours) ? `${totalOrgHours}h / ${totalSeminarsHours}h` : '-'}
                                            </td>
                                            <td className="border border-slate-200 p-2">
                                                <div>{totalCoursesCount > 0 ? `${totalCoursesCount} form / ${totalParticipants} os. / ${totalCourseHours}h` : '-'}</div>
                                                {totalCancelledCoursesCount > 0 && (
                                                    <div className="text-[10px] text-rose-600 mt-0.5">
                                                        odwołane: {totalCancelledCoursesCount}
                                                    </div>
                                                )}
                                            </td>
                                            <td className="border border-slate-200 p-2">
                                                {totalTasksCount > 0 ? `${totalTasksCount}` : '-'}
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* List of all realized teaching forms */}
                        <div className="pt-6">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3">
                                Spis wszystkich zrealizowanych form
                            </h3>
                            {(() => {
                                const realizedForms = [];
                                MONTHS.forEach(m => {
                                    const key = `${schoolYear}_${m.id}`;
                                    const data = monthlyData[key];
                                    if (!data || !Array.isArray(data.courses)) return;

                                    data.courses
                                        .filter(c => !c.cancelled)
                                        .filter(c =>
                                            (c.code && c.code.trim()) ||
                                            (c.name && c.name.trim()) ||
                                            (c.hours && String(c.hours).trim()) ||
                                            (c.participants && String(c.participants).trim())
                                        )
                                        .forEach(c => {
                                            realizedForms.push({
                                                month: m.name,
                                                code: c.code || '',
                                                name: c.name || '',
                                                hours: c.hours || '',
                                                participants: c.participants || ''
                                            });
                                        });
                                });

                                if (realizedForms.length === 0) {
                                    return (
                                        <div className="border border-slate-200 rounded-xl p-4 text-xs text-slate-500 bg-slate-50">
                                            Brak zrealizowanych form dydaktycznych w wybranym roku szkolnym.
                                        </div>
                                    );
                                }

                                return (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs border-collapse border border-slate-200">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-700">
                                                    <th className="border border-slate-200 p-2 text-center w-10">Lp.</th>
                                                    <th className="border border-slate-200 p-2 text-left">Miesiąc</th>
                                                    <th className="border border-slate-200 p-2 text-left">Kod</th>
                                                    <th className="border border-slate-200 p-2 text-left">Nazwa formy</th>
                                                    <th className="border border-slate-200 p-2 text-center">Godziny</th>
                                                    <th className="border border-slate-200 p-2 text-center">Uczestnicy</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {realizedForms.map((form, index) => (
                                                    <tr key={`${form.month}-${form.code}-${index}`} className="hover:bg-slate-50">
                                                        <td className="border border-slate-200 p-2 text-center">{index + 1}</td>
                                                        <td className="border border-slate-200 p-2 font-semibold text-slate-700">{form.month}</td>
                                                        <td className="border border-slate-200 p-2 font-mono">{form.code || '-'}</td>
                                                        <td className="border border-slate-200 p-2">{form.name || '-'}</td>
                                                        <td className="border border-slate-200 p-2 text-center">{form.hours || '-'}</td>
                                                        <td className="border border-slate-200 p-2 text-center">{form.participants || '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-slate-100 font-bold">
                                                    <td colSpan="3" className="border border-slate-200 p-2 text-right">Razem:</td>
                                                    <td className="border border-slate-200 p-2">
                                                        {(() => {
                                                            const uniqueCodes = new Set(
                                                                realizedForms
                                                                    .map(form => (form.code || '').trim().toLocaleLowerCase('pl-PL'))
                                                                    .filter(Boolean)
                                                            );
                                                            return (
                                                                <span>
                                                                    {uniqueCodes.size} form
                                                                    <span className="font-normal text-slate-500"> ({realizedForms.length} wszystkich form)</span>
                                                                </span>
                                                            );
                                                        })()}
                                                    </td>
                                                    <td className="border border-slate-200 p-2 text-center">{totalCourseHours}h</td>
                                                    <td className="border border-slate-200 p-2 text-center">{totalParticipants}</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                );
                            })()}

                        {/* Annual completed tasks */}
                        <div className="pt-6">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3">
                                Wykaz zrealizowanych zadań
                            </h3>
                            {(() => {
                                const taskMap = new Map();
                                MONTHS.forEach(m => {
                                    const data = monthlyData[`${schoolYear}_${m.id}`];
                                    if (!data || !Array.isArray(data.tasks)) return;
                                    data.tasks.forEach(task => {
                                        const description = (task.description || '').trim();
                                        const taskNo = (task.taskNo || '').trim();
                                        const statePriorities = (task.statePriorities || '').trim();
                                        const oeizkPriorities = (task.oeizkPriorities || '').trim();
                                        const collaboration = (task.collaboration || '').trim();
                                        if (!description && !taskNo && !statePriorities && !oeizkPriorities && !collaboration) return;

                                        const dedupeKey = [description, taskNo, statePriorities, oeizkPriorities, collaboration]
                                            .map(v => v.toLocaleLowerCase('pl-PL').replace(/\s+/g, ' ').trim())
                                            .join('|');

                                        if (!taskMap.has(dedupeKey)) {
                                            taskMap.set(dedupeKey, {
                                                months: [m.name], description, taskNo,
                                                statePriorities, oeizkPriorities, collaboration
                                            });
                                        } else {
                                            const existing = taskMap.get(dedupeKey);
                                            if (!existing.months.includes(m.name)) existing.months.push(m.name);
                                        }
                                    });
                                });
                                const annualTasks = Array.from(taskMap.values());

                                if (annualTasks.length === 0) {
                                    return <div className="border border-slate-200 rounded-xl p-4 text-xs text-slate-500 bg-slate-50">Brak zrealizowanych zadań w wybranym roku szkolnym.</div>;
                                }

                                return (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs border-collapse border border-slate-200">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-700">
                                                    <th className="border border-slate-200 p-2 text-center w-10">Lp.</th>
                                                    <th className="border border-slate-200 p-2 text-left">Miesiąc</th>
                                                    <th className="border border-slate-200 p-2 text-left">Zrealizowane zadanie</th>
                                                    <th className="border border-slate-200 p-2 text-center">Nr zadania</th>
                                                    <th className="border border-slate-200 p-2 text-center">Priorytety państwa</th>
                                                    <th className="border border-slate-200 p-2 text-center">Priorytety OEIIZK</th>
                                                    <th className="border border-slate-200 p-2 text-left">We współpracy</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {annualTasks.map((task, index) => (
                                                    <tr key={`${task.description}-${task.taskNo}-${index}`}>
                                                        <td className="border border-slate-200 p-2 text-center">{index + 1}</td>
                                                        <td className="border border-slate-200 p-2 font-semibold text-slate-700">{task.months.join(', ')}</td>
                                                        <td className="border border-slate-200 p-2">{task.description || '-'}</td>
                                                        <td className="border border-slate-200 p-2 text-center">{task.taskNo || '-'}</td>
                                                        <td className="border border-slate-200 p-2 text-center">{task.statePriorities || '-'}</td>
                                                        <td className="border border-slate-200 p-2 text-center">{task.oeizkPriorities || '-'}</td>
                                                        <td className="border border-slate-200 p-2">{task.collaboration || '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-slate-100 font-bold">
                                                    <td colSpan="2" className="border border-slate-200 p-2 text-right">Razem:</td>
                                                    <td colSpan="5" className="border border-slate-200 p-2">{annualTasks.length} unikalnych zadań</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                );
                            })()}
                        </div>

                        {/* Annual supplementary information without duplicates */}
                        <div className="pt-6">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3">
                                Informacje uzupełniające
                            </h3>
                            {(() => {
                                const collectUniqueEntries = (fieldName) => {
                                    const seen = new Set();
                                    const result = [];
                                    MONTHS.forEach(m => {
                                        const value = (monthlyData[`${schoolYear}_${m.id}`]?.[fieldName] || '').trim();
                                        if (!value) return;
                                        value.split(/[;\n]+/)
                                            .map(item => item.trim())
                                            .filter(Boolean)
                                            .forEach(item => {
                                                const normalized = item.toLocaleLowerCase('pl-PL').replace(/\s+/g, ' ').trim();
                                                if (!seen.has(normalized)) {
                                                    seen.add(normalized);
                                                    result.push(item);
                                                }
                                            });
                                    });
                                    return result;
                                };

                                const otherItems = collectUniqueEntries('otherActivities');
                                const consultationItems = collectUniqueEntries('consultationTopics');
                                const developmentItems = collectUniqueEntries('selfDevelopment');

                                const InfoBlock = ({ title, items }) => (
                                    <div className="border border-slate-200 rounded-xl p-4 bg-white">
                                        <div className="text-xs font-bold text-slate-700 mb-2">{title}</div>
                                        {items.length ? (
                                            <ol className="list-decimal pl-5 space-y-1 text-xs text-slate-700">
                                                {items.map((item, index) => <li key={`${title}-${index}`}>{item}</li>)}
                                            </ol>
                                        ) : (
                                            <div className="text-xs text-slate-400">Brak wpisów.</div>
                                        )}
                                    </div>
                                );

                                return (
                                    <div className="grid grid-cols-1 gap-3">
                                        <InfoBlock title="Inne" items={otherItems} />
                                        <InfoBlock title="Tematyka udzielanych konsultacji" items={consultationItems} />
                                        <InfoBlock title="Własny rozwój" items={developmentItems} />
                                    </div>
                                );
                            })()}
                        </div>

                        </div>

                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
