const INTRO_TEXT={"en": ["<div class=\"intro-block\"><span class=\"intro-kicker\">Mission launch</span><h3>SmartExplorer – design a space mission</h3><p>SmartExplorer is an educational simulation of the real process of planning a space mission. Students jointly define a scientific objective, choose the type of mission, design a probe, plan the flight, assess costs and risks, and present their final mission proposal.</p><p>The aim is not only to learn facts about space. Each decision affects the next: a more ambitious research goal may require different instruments, greater mass, a larger budget and new technical solutions.</p></div><div class=\"intro-block\"><h3>What will you do?</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>Investigate</h4><p>Ask questions, formulate hypotheses and analyse data.</p></div><div class=\"intro-mini\"><h4>Design</h4><p>Select technologies and find solutions within given constraints.</p></div><div class=\"intro-mini\"><h4>Collaborate</h4><p>Coordinate decisions between specialist teams.</p></div><div class=\"intro-mini\"><h4>Make decisions</h4><p>Consider costs, risks and the consequences of chosen solutions.</p></div></div></div><div class=\"intro-block\"><h3>The 4Cs competencies</h3><p>The project develops <strong>creativity, communication, collaboration and critical thinking</strong>. Students learn to justify their ideas, verify proposals and, when necessary, revise earlier decisions.</p></div>", "<div class=\"intro-block\"><h3>Eight interconnected design stages</h3><ol><li><strong>Scientific objective:</strong> what do we want to investigate and what research question are we asking?</li><li><strong>Mission type:</strong> orbiter, lander, rover or flyby?</li><li><strong>Payload:</strong> which instruments will enable us to achieve the objective?</li><li><strong>Technical design:</strong> probe structure, power supply, communications and propulsion.</li><li><strong>Trajectory and launch window:</strong> how will we reach the destination and when should we launch?</li><li><strong>Budget:</strong> what will it cost and will it stay within the limit?</li><li><strong>Risks and operations:</strong> what could go wrong and which procedures should we prepare?</li><li><strong>Final proposal:</strong> combine the teams' results into one coherent project.</li></ol><p>The stages are interdependent: changing probe parameters may require recalculating the trajectory, costs and risks.</p></div>", "<div class=\"intro-block\"><h3>One mission – five specialist teams</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>1. Science</h4><p>Defines the research objective, analyses data and justifies the choice of target and mission type.</p></div><div class=\"intro-mini\"><h4>2. Engineering</h4><p>Designs the probe, selects instruments and manages mass, power and technical solutions.</p></div><div class=\"intro-mini\"><h4>3. Navigation</h4><p>Determines flight trajectories and launch windows using mathematics and celestial mechanics.</p></div><div class=\"intro-mini\"><h4>4. Economics</h4><p>Estimates component and operational costs, prepares the budget and checks its limits.</p></div><div class=\"intro-mini\"><h4>5. Mission Control</h4><p>Develops the operations plan, assesses threats and prepares emergency procedures.</p></div></div><p><strong>Important:</strong> no team works in isolation. Agreements and data sharing are essential to developing one coherent mission.</p></div>", "<div class=\"intro-block\"><h3>Two project formats</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>Format I – long-term</h4><p>A project lasting several weeks, a semester or a school year. Students complete the full mission-planning process.</p></div><div class=\"intro-mini\"><h4>Format II – short-term</h4><p>A condensed project for one class block, for example 90 minutes. It introduces key decisions and gives students practice in collaboration.</p></div></div></div><div class=\"intro-block\"><h3>How should the work be organised?</h3><p><strong>Model A – fixed teams:</strong> each group is responsible for its own area and the results are combined into one shared mission.</p><p><strong>Model B – rotating roles:</strong> students move through successive specialisations. In a longer project they may develop several separate missions; in the short format they work at rotating task stations.</p><p>The teacher chooses the format and model to suit the available time, learning objectives and the group's capabilities.</p></div>", "<div class=\"intro-block\"><h3>Learning methods in SmartExplorer</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>PBL – Project Based Learning</h4><p>Learning through a project: independent planning, problem-solving, collaboration and presentation of results.</p></div><div class=\"intro-mini\"><h4>IBL – Inquiry-Based Learning</h4><p>Learning through inquiry: questions, observations, experiments, data analysis and independent conclusions.</p></div><div class=\"intro-mini\"><h4>STEAM</h4><p>Combining science, technology, engineering, arts and mathematics to address practical challenges.</p></div><div class=\"intro-mini\"><h4>ICT</h4><p>Using digital tools, simulators and spreadsheets to support research and project work.</p></div></div></div><div class=\"intro-block\"><h3>Assessment and feedback</h3><p>Assessment should cover not only the final project but also the <strong>learning process</strong>: collaboration, creativity, independence, problem-solving and reflection.</p><ul><li>Agree on clear success criteria with students before work begins.</li><li>Provide regular feedback.</li><li>Use self-assessment, peer assessment and assessment rubrics.</li><li>Recognise contributions from students with different strengths and avoid stereotypical role assignments.</li></ul></div>", "<div class=\"intro-block\"><h3>NOESIS multimedia and videos</h3><p>This section is reserved for NOESIS multimedia introducing the subject of space missions.</p><div class=\"note\">The supplied archive contains neither video files nor verified NOESIS video links. No fictitious resources or arbitrary videos have been added.</div></div><div class=\"intro-block\"><h3>Source materials used to develop this module</h3><ul><li>Smart Explorer – Teacher's Guide (June 2026, version 1.0)</li><li>SmartExplorer – description of two project formats</li><li>Modern teaching methods</li><li>Project (PBL)</li><li>IBL</li><li>STEAM</li><li>Assessment of educational projects</li></ul><p>The module's texts are adapted and abridged from the supplied archive; they are not verbatim reproductions.</p></div>"], "el": ["<div class=\"intro-block\"><span class=\"intro-kicker\">Έναρξη αποστολής</span><h3>SmartExplorer – σχεδιάστε μια διαστημική αποστολή</h3><p>Το SmartExplorer είναι μια εκπαιδευτική προσομοίωση της πραγματικής διαδικασίας σχεδιασμού διαστημικής αποστολής. Οι μαθητές καθορίζουν από κοινού τον επιστημονικό στόχο, επιλέγουν τον τύπο αποστολής, σχεδιάζουν ένα διαστημικό σκάφος, προγραμματίζουν την πτήση, αναλύουν το κόστος και τους κινδύνους και παρουσιάζουν την τελική τους πρόταση.</p><p>Ο στόχος δεν είναι μόνο η απόκτηση γνώσεων για το διάστημα. Κάθε απόφαση επηρεάζει τις επόμενες: ένας πιο φιλόδοξος ερευνητικός στόχος μπορεί να απαιτεί διαφορετικά όργανα, μεγαλύτερη μάζα, υψηλότερο προϋπολογισμό και νέες τεχνικές λύσεις.</p></div><div class=\"intro-block\"><h3>Τι θα κάνετε;</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>Έρευνα</h4><p>Θα θέτετε ερωτήματα, θα διατυπώνετε υποθέσεις και θα αναλύετε δεδομένα.</p></div><div class=\"intro-mini\"><h4>Σχεδιασμός</h4><p>Θα επιλέγετε τεχνολογίες και θα αναζητάτε λύσεις μέσα σε συγκεκριμένους περιορισμούς.</p></div><div class=\"intro-mini\"><h4>Συνεργασία</h4><p>Θα συντονίζετε τις αποφάσεις μεταξύ εξειδικευμένων ομάδων.</p></div><div class=\"intro-mini\"><h4>Λήψη αποφάσεων</h4><p>Θα εξετάζετε το κόστος, τους κινδύνους και τις συνέπειες των επιλογών σας.</p></div></div></div><div class=\"intro-block\"><h3>Οι τέσσερις βασικές δεξιότητες (4C)</h3><p>Το έργο αναπτύσσει τη <strong>δημιουργικότητα, την επικοινωνία, τη συνεργασία και την κριτική σκέψη</strong>. Οι μαθητές μαθαίνουν να τεκμηριώνουν, να ελέγχουν τις ιδέες τους και, όταν χρειάζεται, να αναθεωρούν προηγούμενες αποφάσεις.</p></div>", "<div class=\"intro-block\"><h3>Οκτώ αλληλένδετα στάδια σχεδιασμού</h3><ol><li><strong>Επιστημονικός στόχος:</strong> τι θέλουμε να μελετήσουμε και ποιο ερευνητικό ερώτημα θέτουμε;</li><li><strong>Τύπος αποστολής:</strong> τροχιακό σκάφος, προσεδαφιστής, ρόβερ ή αποστολή διέλευσης (flyby);</li><li><strong>Ωφέλιμο φορτίο:</strong> ποια όργανα θα επιτρέψουν την επίτευξη του στόχου;</li><li><strong>Τεχνικός σχεδιασμός:</strong> δομή του σκάφους, τροφοδοσία, επικοινωνίες και πρόωση.</li><li><strong>Τροχιά και παράθυρο εκτόξευσης:</strong> πώς θα φτάσουμε στον προορισμό και πότε θα εκτοξευθούμε;</li><li><strong>Προϋπολογισμός:</strong> ποιο είναι το κόστος και παραμένει εντός των ορίων;</li><li><strong>Κίνδυνοι και επιχειρήσεις:</strong> τι μπορεί να πάει στραβά και ποιες διαδικασίες πρέπει να προετοιμάσουμε;</li><li><strong>Τελική πρόταση:</strong> συνδυασμός των αποτελεσμάτων των ομάδων σε ένα συνεκτικό σχέδιο.</li></ol><p>Τα στάδια αλληλοεξαρτώνται: η αλλαγή παραμέτρων του σκάφους μπορεί να απαιτεί νέο υπολογισμό της τροχιάς, του κόστους και των κινδύνων.</p></div>", "<div class=\"intro-block\"><h3>Μία αποστολή – πέντε εξειδικευμένες ομάδες</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>1. Επιστημονική ομάδα</h4><p>Καθορίζει τον ερευνητικό στόχο, αναλύει δεδομένα και αιτιολογεί την επιλογή προορισμού και τύπου αποστολής.</p></div><div class=\"intro-mini\"><h4>2. Ομάδα μηχανικής</h4><p>Σχεδιάζει το σκάφος, επιλέγει όργανα και ελέγχει τη μάζα, την τροφοδοσία και τις τεχνικές λύσεις.</p></div><div class=\"intro-mini\"><h4>3. Ομάδα πλοήγησης</h4><p>Καθορίζει τροχιές πτήσης και παράθυρα εκτόξευσης με μαθηματικά και ουράνια μηχανική.</p></div><div class=\"intro-mini\"><h4>4. Οικονομική ομάδα</h4><p>Εκτιμά το κόστος εξαρτημάτων και επιχειρήσεων, καταρτίζει τον προϋπολογισμό και ελέγχει τα όριά του.</p></div><div class=\"intro-mini\"><h4>5. Ομάδα ελέγχου αποστολής</h4><p>Εκπονεί επιχειρησιακό σχέδιο, αναλύει απειλές και προετοιμάζει διαδικασίες έκτακτης ανάγκης.</p></div></div><p><strong>Σημαντικό:</strong> καμία ομάδα δεν λειτουργεί απομονωμένα. Ο συντονισμός και η ανταλλαγή δεδομένων είναι απαραίτητα για μία ενιαία αποστολή.</p></div>", "<div class=\"intro-block\"><h3>Δύο μορφές υλοποίησης του έργου</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>Μορφή I – μακροχρόνια</h4><p>Έργο διάρκειας αρκετών εβδομάδων, ενός εξαμήνου ή ενός σχολικού έτους. Οι μαθητές ολοκληρώνουν ολόκληρη τη διαδικασία σχεδιασμού αποστολής.</p></div><div class=\"intro-mini\"><h4>Μορφή II – βραχυχρόνια</h4><p>Συνοπτικό έργο σε μία διδακτική ενότητα, π.χ. 90 λεπτά. Επιτρέπει την εξοικείωση με τις βασικές αποφάσεις και την εξάσκηση στη συνεργασία.</p></div></div></div><div class=\"intro-block\"><h3>Πώς οργανώνεται η εργασία;</h3><p><strong>Μοντέλο Α – σταθερές ομάδες:</strong> κάθε ομάδα είναι υπεύθυνη για τον τομέα της και τα αποτελέσματα συνδυάζονται σε μία κοινή αποστολή.</p><p><strong>Μοντέλο Β – εναλλαγή ρόλων:</strong> οι μαθητές περνούν διαδοχικά από διαφορετικές ειδικότητες. Σε μακροχρόνιο έργο μπορούν να σχεδιάσουν περισσότερες ξεχωριστές αποστολές· στη σύντομη μορφή εργάζονται σε εναλλασσόμενους σταθμούς δραστηριοτήτων.</p><p>Ο εκπαιδευτικός επιλέγει μορφή και μοντέλο ανάλογα με τον διαθέσιμο χρόνο, τους μαθησιακούς στόχους και τις δυνατότητες της ομάδας.</p></div>", "<div class=\"intro-block\"><h3>Μέθοδοι μάθησης στο SmartExplorer</h3><div class=\"intro-grid\"><div class=\"intro-mini\"><h4>PBL – Μάθηση βάσει έργου</h4><p>Μάθηση μέσα από την υλοποίηση έργου: αυτόνομος σχεδιασμός, επίλυση προβλημάτων, συνεργασία και παρουσίαση αποτελεσμάτων.</p></div><div class=\"intro-mini\"><h4>IBL – Διερευνητική μάθηση</h4><p>Μάθηση μέσω διερεύνησης: ερωτήσεις, παρατηρήσεις, πειράματα, ανάλυση δεδομένων και εξαγωγή ανεξάρτητων συμπερασμάτων.</p></div><div class=\"intro-mini\"><h4>STEAM</h4><p>Συνδυασμός επιστήμης, τεχνολογίας, μηχανικής, τεχνών και μαθηματικών για την αντιμετώπιση πρακτικών προκλήσεων.</p></div><div class=\"intro-mini\"><h4>ΤΠΕ</h4><p>Χρήση ψηφιακών εργαλείων, προσομοιωτών και υπολογιστικών φύλλων για την υποστήριξη της έρευνας και του σχεδιασμού.</p></div></div></div><div class=\"intro-block\"><h3>Αξιολόγηση και ανατροφοδότηση</h3><p>Η αξιολόγηση πρέπει να αφορά όχι μόνο το τελικό έργο αλλά και τη <strong>μαθησιακή διαδικασία</strong>: συνεργασία, δημιουργικότητα, αυτονομία, επίλυση προβλημάτων και αναστοχασμό.</p><ul><li>Καθορίστε με τους μαθητές σαφή κριτήρια επιτυχίας πριν από την έναρξη της εργασίας.</li><li>Παρέχετε τακτική ανατροφοδότηση.</li><li>Χρησιμοποιήστε αυτοαξιολόγηση, ετεροαξιολόγηση από συμμαθητές και κλίμακες κριτηρίων.</li><li>Αναγνωρίστε τη συμβολή μαθητών με διαφορετικές ικανότητες και αποφύγετε στερεοτυπικές αναθέσεις ρόλων.</li></ul></div>", "<div class=\"intro-block\"><h3>Πολυμέσα και βίντεο NOESIS</h3><p>Αυτή η ενότητα προορίζεται για πολυμεσικό υλικό NOESIS που εισάγει τους μαθητές στο θέμα των διαστημικών αποστολών.</p><div class=\"note\">Το αρχείο που παραδόθηκε δεν περιλαμβάνει αρχεία βίντεο ή επαληθευμένους συνδέσμους βίντεο NOESIS. Δεν προστέθηκαν ανύπαρκτοι πόροι ή τυχαία βίντεο.</div></div><div class=\"intro-block\"><h3>Πηγές που χρησιμοποιήθηκαν για την ανάπτυξη της ενότητας</h3><ul><li>Smart Explorer – Οδηγός εκπαιδευτικών (Ιούνιος 2026, έκδοση 1.0)</li><li>SmartExplorer – περιγραφή δύο μορφών υλοποίησης</li><li>Σύγχρονες μέθοδοι διδασκαλίας</li><li>Έργο (PBL)</li><li>IBL</li><li>STEAM</li><li>Αξιολόγηση εκπαιδευτικών έργων</li></ul><p>Τα κείμενα της ενότητας αποτελούν προσαρμογή και σύνοψη του υλικού που παραδόθηκε και όχι κατά λέξη αναπαραγωγή.</p></div>"]};
function tr(key){return (UI_TRANSLATIONS[currentLang]||UI_TRANSLATIONS.pl)[key]||UI_TRANSLATIONS.pl[key]||key}
function resourceTitle(r){return currentLang==='pl'?r.title:(RESOURCE_TITLES[currentLang]?.[r.title]||r.title)}
function moduleTitle(m){const idx=MODULES.findIndex(x=>x.id===m.id);return currentLang==='pl'?m.title:MODULE_NAMES[currentLang][idx]}
function languageControls(){return `<div class="languages" role="group" aria-label="Language / Język / Γλώσσα">${['pl','en','el'].map(l=>`<button type="button" class="btn" lang="${l}" aria-pressed="${currentLang===l}" onclick="setLanguage('${l}')">${l.toUpperCase()}</button>`).join('')}</div>`}
function setLanguage(lang){SmartExplorerAccess.setLang(lang);currentLang=lang;document.documentElement.lang=lang;updateHeader();if(active==='home')home();else if(active==='intro')renderIntro();else openModule(active);updateAuthLabels()}
function updateAuthLabels(){document.getElementById('authTitle').textContent=tr('authTitle');document.getElementById('authDescription').textContent=tr('authDesc');document.querySelector('label[for="password"]').textContent=tr('authLabel');document.querySelector('#authForm button[type="submit"]').textContent=tr('authSubmit');document.getElementById('cancelAuth').textContent=tr('cancel');document.getElementById('authError').textContent=tr('bad')}

function updateHeader(){document.getElementById("languageHost").innerHTML=languageControls();$('authButton').innerHTML=unlocked?'<i class="fa-solid fa-lock-open"></i> '+tr('lock'):'<i class="fa-solid fa-lock"></i> '+tr('unlock');$('authButton').onclick=()=>unlocked?logout():openAuth();}
function home(){active='home';updateHeader();$('main').innerHTML=`<section class="hero"><span class="eyebrow">${tr('eyebrow')}</span><h1>${tr('heading')}<br><span style="color:#7cdcf7">${tr('mission')}</span></h1><p class="lead">${tr('lead')}</p></section><div class="section-title"><h2>${tr('modules')}</h2><span style="color:#afc7df;font-size:.9rem">${tr('count')}</span></div><section class="grid" aria-label="${tr('modules')}">${MODULES.map((m,i)=>`<article class="card"><div class="card-top"><span class="symbol"><i class="fa-solid ${m.icon}" aria-hidden="true"></i></span><span class="tag ${i===0?'open':''}"><i class="fa-solid ${i===0?'fa-lock-open':'fa-lock'}"></i> ${i===0?tr('open'):unlocked?tr('unlocked'):tr('password')}</span></div><h3>${i?`${i}. `:''}${escapeHtml(moduleTitle(m))}</h3><p>${i===0?tr('introdesc'):`${m.items.length} ${tr('material')}`}</p><button class="btn ${i===0?'primary':''}" onclick="openModule('${m.id}')">${i===0||unlocked?tr('go'):'<i class="fa-solid fa-lock"></i> '+tr('openmod')}</button></article>`).join('')}</section>`;}
const INTRO_SECTIONS=[
{id:'start',label:'Poznaj projekt',icon:'fa-rocket',html:`<div class="intro-block"><span class="intro-kicker">Start misji</span><h3>SmartExplorer – zaprojektuj misję kosmiczną</h3><p>SmartExplorer to edukacyjna symulacja rzeczywistego procesu planowania misji kosmicznej. Uczniowie wspólnie określają cel naukowy, wybierają typ misji, projektują sondę, planują lot, analizują koszty i ryzyko oraz przedstawiają końcową propozycję misji.</p><p>Nie chodzi wyłącznie o poznanie faktów dotyczących kosmosu. Każda decyzja wpływa na następne: ambitniejszy cel badawczy może wymagać innych instrumentów, większej masy, większego budżetu i nowych rozwiązań technicznych.</p></div><div class="intro-block"><h3>Co będziesz robić?</h3><div class="intro-grid"><div class="intro-mini"><h4><i class="fa-solid fa-magnifying-glass"></i> Badać</h4><p>Stawiać pytania, formułować hipotezy i analizować dane.</p></div><div class="intro-mini"><h4><i class="fa-solid fa-gears"></i> Projektować</h4><p>Dobierać technologie i szukać rozwiązań w określonych ograniczeniach.</p></div><div class="intro-mini"><h4><i class="fa-solid fa-people-group"></i> Współpracować</h4><p>Uzgadniać decyzje między zespołami specjalistycznymi.</p></div><div class="intro-mini"><h4><i class="fa-solid fa-shield-halved"></i> Podejmować decyzje</h4><p>Rozważać koszty, ryzyko i konsekwencje wybranych rozwiązań.</p></div></div></div><div class="intro-block"><h3>Kompetencje 4K</h3><p>Projekt rozwija <strong>kreatywność, komunikację, kooperację i krytyczne myślenie</strong>. Uczniowie uczą się argumentować, weryfikować pomysły i – gdy to konieczne – zmieniać wcześniejsze decyzje.</p></div>`},
{id:'steps',label:'Etapy misji',icon:'fa-list-ol',html:`<div class="intro-block"><h3>Osiem powiązanych etapów projektowania</h3><ol><li><strong>Cel naukowy:</strong> co chcemy zbadać i jakie pytanie badawcze stawiamy?</li><li><strong>Typ misji:</strong> orbiter, lądownik, łazik czy przelot obok obiektu (flyby)?</li><li><strong>Ładunek użyteczny (payload):</strong> jakie instrumenty umożliwią realizację celu?</li><li><strong>Projekt techniczny:</strong> konstrukcja sondy, zasilanie, łączność i napęd.</li><li><strong>Trajektoria i okno startowe:</strong> jak dotrzeć do celu i kiedy wystartować?</li><li><strong>Budżet:</strong> jakie będą koszty i czy mieszczą się w limicie?</li><li><strong>Ryzyko i operacje:</strong> co może pójść nie tak i jakie przygotować procedury?</li><li><strong>Finalna propozycja:</strong> połączenie wyników zespołów w spójny projekt.</li></ol><p>Etapy są ze sobą powiązane – zmiana parametrów sondy może wymagać ponownego przeliczenia trajektorii, kosztów i ryzyka.</p></div>`},
{id:'teams',label:'Pięć zespołów',icon:'fa-users',html:`<div class="intro-block"><h3>Jedna misja – pięć zespołów specjalistycznych</h3><div class="intro-grid"><div class="intro-mini"><h4>1. Naukowy</h4><p>Określa cel badawczy, analizuje dane i uzasadnia wybór obiektu oraz typu misji.</p></div><div class="intro-mini"><h4>2. Inżynieryjny</h4><p>Projektuje sondę, dobiera instrumenty, kontroluje masę, zasilanie i rozwiązania techniczne.</p></div><div class="intro-mini"><h4>3. Nawigacyjny</h4><p>Wyznacza trajektorię lotu i okna startowe, wykorzystując matematykę i mechanikę nieba.</p></div><div class="intro-mini"><h4>4. Ekonomiczny</h4><p>Szacuje koszty komponentów i operacji, przygotowuje budżet oraz sprawdza jego ograniczenia.</p></div><div class="intro-mini"><h4>5. Kontroli Misji</h4><p>Opracowuje plan operacyjny, analizuje zagrożenia i przygotowuje procedury awaryjne.</p></div></div><p><strong>Ważne:</strong> żadna grupa nie działa w oderwaniu od pozostałych. Uzgodnienia i wymiana danych są niezbędne do przygotowania jednej spójnej misji.</p></div>`},
{id:'variants',label:'Warianty pracy',icon:'fa-clock',html:`<div class="intro-block"><h3>Dwa warianty realizacji projektu</h3><div class="intro-grid"><div class="intro-mini"><h4>Wariant I – długoterminowy</h4><p>Projekt na kilka tygodni, semestr lub rok szkolny. Uczniowie przechodzą przez pełny proces planowania misji.</p></div><div class="intro-mini"><h4>Wariant II – krótkoterminowy</h4><p>Skrócony projekt na jeden blok zajęć, np. 90 minut. Pozwala poznać najważniejsze decyzje i przećwiczyć współpracę.</p></div></div></div><div class="intro-block"><h3>Jak zorganizować pracę?</h3><p><strong>Model A – stałe zespoły:</strong> każda grupa odpowiada za własny obszar, a rezultaty są łączone w jedną wspólną misję.</p><p><strong>Model B – zmiana ról:</strong> uczniowie przechodzą przez kolejne specjalizacje. W dłuższym projekcie mogą opracować kilka odrębnych misji; w krótkim wariancie pracują w systemie stacji zadaniowych.</p><p>Nauczyciel dobiera wariant i model do czasu, celów dydaktycznych oraz możliwości grupy.</p></div>`},
{id:'methods',label:'Jak się uczymy?',icon:'fa-graduation-cap',html:`<div class="intro-block"><h3>Metody pracy w SmartExplorer</h3><div class="intro-grid"><div class="intro-mini"><h4>PBL – Project Based Learning</h4><p>Uczenie się poprzez realizację projektu: samodzielne planowanie, rozwiązywanie problemów, współpraca i prezentacja rezultatów.</p></div><div class="intro-mini"><h4>IBL – Inquiry-Based Learning</h4><p>Uczenie się przez dociekanie: pytania, obserwacje, doświadczenia, analiza danych i samodzielne wnioski.</p></div><div class="intro-mini"><h4>STEAM</h4><p>Łączenie nauki, technologii, inżynierii, sztuki i matematyki w rozwiązywaniu praktycznych wyzwań.</p></div><div class="intro-mini"><h4>TIK</h4><p>Wykorzystywanie narzędzi cyfrowych, symulatorów i arkuszy kalkulacyjnych jako wsparcia procesu badawczego i projektowego.</p></div></div></div><div class="intro-block"><h3>Ocenianie i informacja zwrotna</h3><p>Ocenie powinien podlegać nie tylko końcowy projekt, ale również <strong>proces uczenia się</strong>: współpraca, kreatywność, samodzielność, rozwiązywanie problemów i refleksja.</p><ul><li>Ustal z uczniami jasne kryteria sukcesu przed rozpoczęciem pracy.</li><li>Regularnie przekazuj informację zwrotną.</li><li>Wykorzystuj samoocenę, ocenę koleżeńską i rubryki oceniania.</li><li>Uwzględniaj wkład uczniów o różnych predyspozycjach i unikaj stereotypowego przydzielania ról.</li></ul></div>`},
{id:'media',label:'Multimedia NOESIS',icon:'fa-film',html:`<div class="intro-block"><h3>Multimedia i filmy NOESIS</h3><p>Ta część modułu jest przeznaczona na materiały multimedialne NOESIS wprowadzające do tematyki misji kosmicznych.</p><div class="note"><i class="fa-solid fa-circle-info"></i> W przekazanym archiwum nie ma plików wideo ani zweryfikowanych adresów filmów NOESIS. Nie dodano fikcyjnych materiałów ani nie przypisano przypadkowych filmów.</div></div><div class="intro-block"><h3>Materiały źródłowe wykorzystane do opracowania modułu</h3><ul><li>Smart Explorer – poradnik dla nauczycieli (wydanie: czerwiec 2026, wersja 1.0)</li><li>SmartExplorer – opis dwóch wariantów realizacji projektu</li><li>Nowoczesne metody nauczania</li><li>Projekt (PBL)</li><li>IBL</li><li>STEAM</li><li>Ocenianie projektów edukacyjnych</li></ul><p>Teksty w module są opracowaniem i skrótem materiałów z przekazanego archiwum, a nie dosłownym przedrukiem dokumentów.</p></div>`}
];
let introSection='start';
function renderIntro(){const tabs=INTRO_SECTIONS.map(s=>`<button type="button" class="btn" aria-pressed="${introSection===s.id}" onclick="setIntroSection('${s.id}')"><i class="fa-solid ${s.icon}" aria-hidden="true"></i> ${currentLang==='pl'?s.label:INTRO_LABELS[currentLang][INTRO_SECTIONS.indexOf(s)]}</button>`).join('');const section=INTRO_SECTIONS.find(s=>s.id===introSection)||INTRO_SECTIONS[0];$('main').innerHTML=`<button class="btn back" onclick="home()"><i class="fa-solid fa-arrow-left"></i> ${tr('all')}</button><section class="panel"><div class="panel-heading"><span class="symbol"><i class="fa-solid fa-rocket"></i></span><div><div class="eyebrow">${tr('public')}</div><h2>${moduleTitle(MODULES[0])}</h2></div></div><p>${tr('introhelp')}</p><nav class="intro-tabs" aria-label="${moduleTitle(MODULES[0])}">${tabs}</nav><div id="introContent">${currentLang==='pl'?section.html:INTRO_TEXT[currentLang][INTRO_SECTIONS.indexOf(section)]}</div><div class="note">${tr('remaining')}</div></section>`;}
function setIntroSection(id){introSection=id;renderIntro();}
function openModule(id){const m=MODULES.find(x=>x.id===id);if(!m)return;if(id!=='intro'&&!unlocked){pending=id;openAuth();return;}active=id;updateHeader();if(id==='intro'){renderIntro();window.scrollTo(0,0);return;}$('main').innerHTML=`<button class="btn back" onclick="home()"><i class="fa-solid fa-arrow-left"></i> ${tr('all')}</button><section class="panel"><div class="panel-heading"><span class="symbol"><i class="fa-solid ${m.icon}"></i></span><div><div class="eyebrow">${id==='intro'?tr('public'):tr('restricted')}</div><h2>${escapeHtml(moduleTitle(m))}</h2></div></div><div aria-label="Materiały modułu">${m.items.map((r,i)=>`<div class="resource"><span class="resource-icon"><i class="fa-solid ${r.type==='doc'?'fa-file-lines':r.type==='media'?'fa-film':r.type==='content'?'fa-book-open':'fa-screwdriver-wrench'}"></i></span><span class="resource-name">${escapeHtml(resourceTitle(r))}</span><button class="btn" onclick="openResource('${m.id}',${i})">${tr('openresource')} <i class="fa-solid fa-arrow-right"></i></button></div>`).join('')}</div><div class="note"><i class="fa-solid fa-circle-info"></i> ${tr('placeholder')}</div></section>`;window.scrollTo(0,0);}
function openResource(id,index){if(id!=='intro'&&!unlocked){pending=id;openAuth();return;}const key=`${id}:${index}`,url=RESOURCE_LINKS[key],m=MODULES.find(x=>x.id===id);if(url&&(/^(https?:\/\/|\.\.?\/|[a-z0-9_-]+\/)/i.test(url))){window.location.assign(url);return;}alert(`${tr('missing')} RESOURCE_LINKS: ${key}`);}
function openAuth(){$('authOverlay').classList.remove('hidden');$('authError').classList.add('hidden');$('password').value='';$('password').focus();}
function closeAuth(){$('authOverlay').classList.add('hidden');pending=null;}
function logout(){unlocked=false;SmartExplorerAccess.lock();home();}
$('authButton').onclick=openAuth;$('cancelAuth').onclick=closeAuth;$('authForm').onsubmit=e=>{e.preventDefault();if($('password').value===ACCESS_PASSWORD){unlocked=true;SmartExplorerAccess.unlock();$('authOverlay').classList.add('hidden');const target=pending;pending=null;target?openModule(target):home();}else{$('authError').classList.remove('hidden');$('password').select();}};
$('authOverlay').addEventListener('click',e=>{if(e.target===$('authOverlay'))closeAuth();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('authOverlay').classList.contains('hidden'))closeAuth();});home();updateAuthLabels();
</script></body></html>
